[package]
name = "present-flow"
version = "0.1.0"
description = "Rama, and the day in front of you"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop entry point is a thin wrapper around this, so the same code
# can be reached from a test or another host later.
name = "present_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"

[profile.release]
# A personal widget is launched far more often than it is built.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
